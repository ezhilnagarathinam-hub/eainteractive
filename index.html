<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Aspirant Voice Agent</title>
    <style>
      :root {
        --bg-1: #4f46e5;
        --bg-2: #06b6d4;
        --bg-3: #22c55e;
        --card: rgba(255, 255, 255, 0.14);
        --text: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(760px, 100%);
        background: var(--card);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
      }

      h1 { margin-top: 0; font-size: clamp(1.4rem, 3vw, 2rem); }
      p { opacity: 0.95; }

      .agent-wrap {
        margin: 26px 0;
        display: flex;
        justify-content: center;
      }

      .agent {
        width: 136px;
        aspect-ratio: 1;
        border-radius: 999px;
        background: radial-gradient(circle at 28% 22%, #fff, #a5b4fc 35%, #1d4ed8 100%);
        box-shadow: 0 0 0 12px rgba(255, 255, 255, 0.2), 0 0 24px rgba(255, 255, 255, 0.5);
        transition: transform 0.18s ease, filter 0.18s ease;
      }

      .agent.speaking {
        transform: scale(1.08);
        animation: pulse 1.25s infinite;
        filter: saturate(1.3);
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 12px rgba(255,255,255,0.2), 0 0 24px rgba(255,255,255,0.5); }
        50% { box-shadow: 0 0 0 20px rgba(255,255,255,0.12), 0 0 42px rgba(255,255,255,0.72); }
      }

      .controls { display: flex; gap: 12px; flex-wrap: wrap; }

      button {
        border: 0;
        padding: 12px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
      }

      #startBtn { background: #0f172a; color: white; }
      #stopBtn { background: #dc2626; color: white; }

      .status {
        margin: 14px 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.28);
        min-height: 44px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }

      .field {
        background: rgba(15, 23, 42, 0.25);
        border-radius: 12px;
        padding: 10px;
      }

      .label { display: block; font-size: 0.8rem; opacity: 0.82; }
      .value { font-weight: 700; margin-top: 5px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Voice Support Agent for Exam Aspirants</h1>
      <p>Click <strong>Start Voice Agent</strong> and answer the questions by voice: name, contact number, location, and exam name.</p>

      <div class="agent-wrap"><div class="agent" id="agent"></div></div>

      <div class="controls">
        <button id="startBtn">Start Voice Agent</button>
        <button id="stopBtn">Stop</button>
      </div>

      <div class="status" id="status">Waiting to start...</div>

      <section class="grid">
        <div class="field"><span class="label">Name</span><div class="value" id="nameVal"></div></div>
        <div class="field"><span class="label">Contact No</span><div class="value" id="contactVal"></div></div>
        <div class="field"><span class="label">Location</span><div class="value" id="locationVal"></div></div>
        <div class="field"><span class="label">Exam Name</span><div class="value" id="examVal"></div></div>
      </section>
    </main>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;
      const agent = document.getElementById('agent');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');

      const fields = [
        { key: 'name', label: 'your full name', el: document.getElementById('nameVal') },
        { key: 'contact', label: 'your contact number', el: document.getElementById('contactVal') },
        { key: 'location', label: 'your location', el: document.getElementById('locationVal') },
        { key: 'exam', label: 'the exam name you are preparing for', el: document.getElementById('examVal') },
      ];

      const data = {};
      let current = 0;
      let recognition;
      let active = false;

      function setStatus(msg) { statusEl.textContent = msg; }

      function speak(text, after) {
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        agent.classList.add('speaking');
        u.onend = () => {
          agent.classList.remove('speaking');
          after && after();
        };
        synth.speak(u);
      }

      function askCurrentQuestion() {
        if (!active) return;
        if (current >= fields.length) {
          speak('Thank you. Your details have been captured successfully.');
          setStatus('Conversation complete.');
          active = false;
          return;
        }
        const q = `Please tell me ${fields[current].label}.`;
        setStatus(q);
        speak(q, () => recognition.start());
      }

      function start() {
        if (!SpeechRecognition) {
          setStatus('Your browser does not support speech recognition. Use latest Chrome or Edge.');
          return;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript.trim();
          const f = fields[current];
          data[f.key] = spoken;
          f.el.textContent = spoken;
          current += 1;
          askCurrentQuestion();
        };

        recognition.onerror = (event) => {
          setStatus(`Could not hear clearly (${event.error}). Listening again...`);
          setTimeout(() => active && recognition.start(), 700);
        };

        recognition.onend = () => {
          if (active && current < fields.length && !synth.speaking) {
            recognition.start();
          }
        };

        active = true;
        current = 0;
        fields.forEach((f) => (f.el.textContent = ''));
        setStatus('Agent started.');
        speak('Hello aspirant. I am your voice support agent.', askCurrentQuestion);
      }

      function stop() {
        active = false;
        synth.cancel();
        recognition && recognition.stop();
        agent.classList.remove('speaking');
        setStatus('Agent stopped.');
      }

      startBtn.addEventListener('click', start);
      stopBtn.addEventListener('click', stop);
    </script>
  </body>
</html>
